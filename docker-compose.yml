# The ontology runtime for local development: PostgreSQL, the ontology registry
# (metadata plane) and the object store (data plane).
#
# These are internal servers, not fab services, so they are not declared in a
# layer and not packaged into an assembly. They are the substrate fab services
# run against, which is why they are plain containers described here.
#
#   docker compose up -d
#   fab schema publish --version 0.1.0 --draft
#
# Both planes share one database by default, which is the common single-instance
# deployment. They are separable: point FAB_OBJECT_STORE_DB_URL at another
# database and nothing else changes.

name: fab-ontology

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fab}
      POSTGRES_DB: ${POSTGRES_DB:-fab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fab} -d ${POSTGRES_DB:-fab}"]
      interval: 2s
      timeout: 3s
      retries: 30

  ontology-registry:
    build:
      context: .
      dockerfile: build/Dockerfile
    command: ["/usr/local/bin/ontology-registry"]
    environment:
      FAB_LISTEN_ADDRESS: ":8081"
      FAB_REGISTRY_DB_URL: postgres://${POSTGRES_USER:-fab}:${POSTGRES_PASSWORD:-fab}@postgres:5432/${POSTGRES_DB:-fab}?sslmode=disable
      FAB_LOG_LEVEL: ${FAB_LOG_LEVEL:-info}
    ports:
      - "${FAB_REGISTRY_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ontology-objectstore:
    build:
      context: .
      dockerfile: build/Dockerfile
    command: ["/usr/local/bin/ontology-objectstore"]
    environment:
      FAB_LISTEN_ADDRESS: ":8082"
      FAB_OBJECT_STORE_DB_URL: postgres://${POSTGRES_USER:-fab}:${POSTGRES_PASSWORD:-fab}@postgres:5432/${POSTGRES_DB:-fab}?sslmode=disable
      FAB_REGISTRY_URL: http://ontology-registry:8081
      # Which ontology the data plane enforces. The tag is resolved on every
      # request, so promoting a version reaches this server without a restart.
      FAB_ONTOLOGY_NAME: ${FAB_ONTOLOGY_NAME:-acme-corp}
      FAB_ONTOLOGY_TAG: ${FAB_ONTOLOGY_TAG:-dev}
      FAB_LOG_LEVEL: ${FAB_LOG_LEVEL:-info}
    ports:
      - "${FAB_OBJECT_STORE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: the object store resolves the ontology per request,
      # so it comes up before anything has been published and keeps running while
      # the registry restarts.
      ontology-registry:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
